worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    sendfile      on;

    # Text compression — HTML/CSS/SVG/JSON/XML/markdown. Raster images
    # (jpg/png/webp) are already compressed and are deliberately excluded.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/markdown text/xml text/xsl
                      application/json application/ld+json application/javascript
                      application/xml application/rss+xml image/svg+xml
                      application/manifest+json;

    # Temp dirs writable by non-root
    client_body_temp_path /tmp/nginx_client 1 2;
    proxy_temp_path       /tmp/nginx_proxy;
    fastcgi_temp_path     /tmp/nginx_fastcgi;

    server {
        listen 80;
        root  /var/www/html/public;
        index index.php;
        charset utf-8;

        # ---------------------------------------------------------------
        # Security headers — applied to every response.
        #
        # `always` makes nginx emit these on error pages too (404, 500…),
        # not just 2xx/3xx — a 404 served to a vulnerability scanner
        # should not carry fewer protections than a normal page.
        #
        # HSTS assumes the site is served HTTPS-only behind a TLS-
        # terminating reverse proxy (see docs/DEPLOY.md). If you serve
        # plain HTTP anywhere, remove the HSTS line.
        #
        # CSP keeps `'unsafe-inline'` for scripts and styles because the
        # layout ships a small inline <script> (mobile nav, cookie notice)
        # and templates use inline style attributes. A hash-based CSP
        # would be stricter but brittle — every markup tweak would need a
        # hash update. `frame-ancestors 'none'` makes X-Frame-Options
        # redundant in modern browsers; both are kept for older ones.
        # ---------------------------------------------------------------
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'" always;

        # Block any request for a hidden file or directory (anything whose
        # path contains a segment starting with a dot). Defense-in-depth
        # against `.git/`, `.env`, `.htaccess`, `.DS_Store` etc.
        # accidentally landing inside `public/`. Regex locations override
        # prefix locations in nginx priority, so this catches
        # `/assets/.foo` too. `log_not_found off` keeps the access log
        # quiet under vulnerability-scanner traffic.
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Static assets served directly with long-lived cache headers.
        # Safe because every asset URL the templates emit carries a
        # `?v=<mtime>` version stamp — changing the file changes the URL.
        location /assets/ {
            expires 1y;
            # `add_header` inside a location block *replaces* the
            # server-level set, so the security headers are re-declared
            # here alongside the cache header.
            add_header Cache-Control            "public, immutable" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header X-Content-Type-Options    "nosniff" always;
            add_header X-Frame-Options           "DENY" always;
            add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
            add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'" always;
            try_files $uri =404;
        }

        # Enforce trailing slash on directory-like paths (no extension),
        # so /about redirects to /about/. Paths containing a dot are left
        # alone — that is what lets /about.md reach the front controller.
        if ($request_uri ~ ^(/[^.?]*)([^/])(\?.*)?$) {
            return 301 $1$2/$3;
        }

        # Front controller: everything else goes through index.php
        location / {
            try_files $uri /index.php$is_args$args;
        }

        # FastCGI is wired ONLY to /index.php, not to any `.php` file that
        # might end up in public/. There is exactly one PHP entry point on
        # this site (the front controller) — anything else served via
        # FastCGI would be either dead weight or a foot-gun, so the rule
        # is explicit. `location =` (exact match) means even
        # `/index.php/foo` is not FastCGI-executed.
        location = /index.php {
            fastcgi_pass  127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include       fastcgi_params;
            # $http_host, not $host — $host strips the port, so generated
            # absolute URLs on a non-80 dev port would silently drop it.
            fastcgi_param HTTP_HOST $http_host;
        }
    }
}
